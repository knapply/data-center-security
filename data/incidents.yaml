- id: 2025-pjm-capacity-shortfall
  date: 2025-12-17
  title: PJM capacity auction clears at the cap and falls short, citing data centers
  type: development
  category: [energy, market]
  status: ongoing
  severity: high
  location: null
  affects: [power]
  impacts: [cost]
  operators: []
  vendors: [PJM Interconnection]
  summary: >
    PJM's 2027/28 auction cleared at the $333.44/MW-day cap and came up 6,623 MW short of
    its reliability requirement, the first RTO-wide shortfall; PJM attributed 5,100 MW of
    the 5,250 MW rise in forecast peak to data centers. The July 2026 auction for 2028/29
    again cleared at the cap and short, after prices had already jumped from $28.92 to
    $269.92 in the 2025/26 auction.
  sources:
    - {publisher: PJM Interconnection, url: "https://www.pjm.com/-/media/DotCom/about-pjm/newsroom/2025-releases/20251217-pjm-auction-procures-134479-mw-of-generation-resources.pdf"}
