  root_cause:
    summary: >
      During a planned upgrade, a third-party contractor incorrectly sent a signal that
      closed the valves from the chilled-water buffer tanks, cutting cooling.
    confidence: likely
    components:
      - part: Chilled-water buffer tank valves and control signal
        role: origin
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          Equinix's account via DCD; there is no independent report. MAS describes only a
          cooling-system malfunction. The contractor and controls vendor are not published.
      - part: Bank failover (DBS, Citibank)
        role: contributing
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          MAS found both banks missed its recovery requirements; DBS could not fail over
          because of a network misconfiguration.
  supply_chain_factors:
    - factor: An error by a third-party contractor working on the cooling system caused the outage.
      component: cooling
      confidence: likely

