- id: 2022-kakao-pangyo-fire
  date: 2022-10-15
  title: Battery fire at SK C&C Pangyo data center takes down Kakao services
  type: incident
  category: [physical]
  status: confirmed
  severity: critical
  location: {city: Seongnam, country: KR, lat: 37.40, lon: 127.11}
  facility_type: data center
  affects: [ups, power, facility]
  impacts: [outage, service-degradation]
  operators: [SK C&C, Kakao]
  vendors: []
  summary: >
    A fire that a government review traced to lithium-ion batteries in a basement
    battery room knocked out UPS and backup power together, forcing a power cut to the
    facility. Kakao's messaging, payment and mobility services were disrupted for days,
    127.5 hours in total by the ministry's count.
  sources:
    - {publisher: Korea JoongAng Daily, url: "https://www.koreajoongangdaily.com/business/ict-ministry-completes-its-probe-of-kakao-service-outage/11629261"}
    - {publisher: Bloomberg via Data Center Knowledge, url: "https://www.datacenterknowledge.com/business/data-center-fire-triggers-lithium-ion-battery-doubts-south-korea"}
    - {publisher: The Register, url: "https://www.theregister.com/2022/10/17/sk_cc_naver_kaako_fire/"}

- id: 2023-gcp-paris-water-fire
  date: 2023-04-26
  title: Water leak and fire take Google Cloud europe-west9 zone offline
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Paris, country: FR, lat: 48.86, lon: 2.35}
  facility_type: cloud region
  affects: [ups, facility]
  impacts: [outage, service-degradation]
  operators: [Google Cloud, Global Switch]
  vendors: []
  summary: >
    Water from a cooling-system pipe leaked into a UPS battery room in a Global Switch
    colocation building and caused a fire. The resulting shutdown hit multiple zones of
    Google Cloud's Paris region, and part of europe-west9-a needed a multi-day staged
    recovery.
  sources:
    - {publisher: Google Cloud status page, url: "https://status.cloud.google.com/incidents/dS9ps52MUnxQfyDGPfkY"}
    - {publisher: The Register, url: "https://www.theregister.com/2023/04/26/google_cloud_outage/"}

- id: 2023-azure-sydney-chillers
  date: 2023-08-30
  title: Utility power sag trips chillers in Azure Australia East
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Sydney, country: AU, lat: -33.87, lon: 151.21}
  facility_type: cloud region
  affects: [power, cooling]
  impacts: [outage, service-degradation]
  operators: [Microsoft Azure]
  vendors: []
  summary: >
    A lightning-induced utility voltage sag tripped chillers at a Sydney datacenter;
    night staffing was too thin to restart them in time, and Microsoft shut down
    infrastructure in two data halls to protect hardware. Some Azure services stayed
    degraded until September 3.
  sources:
    - {publisher: Microsoft Azure post-incident review (VVTQ-J98), url: "https://azure.status.microsoft/en-us/status/history/?trackingId=VVTQ-J98"}
    - {publisher: The Register, url: "https://www.theregister.com/2023/09/04/microsoft_australia_outage_incident_report/"}

- id: 2023-equinix-sg-cooling
  date: 2023-10-14
  title: Cooling fault at Equinix Singapore disrupts major banks
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Singapore, country: SG, lat: 1.35, lon: 103.82}
  facility_type: colocation
  affects: [cooling]
  impacts: [outage, financial]
  operators: [Equinix, DBS, Citibank]
  vendors: []
  summary: >
    A third-party contractor's incorrect signal during a planned upgrade cut
    chilled-water flow at an Equinix Singapore data center, taking down DBS and Citibank
    digital banking and payments for about 14 hours. MAS ordered both banks to
    investigate and later restricted DBS's non-essential IT changes and business
    expansion over this and earlier disruptions.
  sources:
    - {publisher: Monetary Authority of Singapore, url: "https://www.mas.gov.sg/news/parliamentary-replies/2023/oral-reply-to-parliamentary-question-onbanking-services-disruption-of-dbs-and-citibank"}
    - {publisher: DatacenterDynamics, url: "https://www.datacenterdynamics.com/en/news/equinix-blames-singapore-outage-on-third-party-contractor/"}
    - {publisher: Data Center Knowledge, url: "https://www.datacenterknowledge.com/uptime/dbs-citi-s-banking-services-resume-after-data-center-disruption"}

- id: 2024-red-sea-cable-cuts
  date: 2024-02-24
  title: Seacom, AAE-1 and EIG subsea cables cut in the southern Red Sea
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Southern Red Sea, country: YE, lat: 13.5, lon: 42.8}
  facility_type: subsea cable
  affects: [connectivity]
  impacts: [service-degradation]
  operators: []
  vendors: []
  summary: >
    Seacom, AAE-1 and the already-faulted EIG were damaged; US officials and the ICPC
    said the dragging anchor of the Houthi-struck MV Rubymar was the likely cause.
    HGC estimated about 25% of traffic on the affected routes was hit, and the conflict
    delayed repairs.
  sources:
    - {publisher: Bloomberg via Data Center Knowledge, url: "https://www.datacenterknowledge.com/networks/houthi-sunk-ship-seen-likely-cause-severed-red-sea-cables"}
    - {publisher: CBS News, url: "https://www.cbsnews.com/news/houthis-ship-cutting-red-sea-telecommunications-cables/"}

- id: 2024-digital-realty-sg-fire
  date: 2024-09-10
  title: Lithium-ion battery fire at Digital Realty Singapore hits Alibaba Cloud
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Singapore, country: SG, lat: 1.33, lon: 103.70}
  facility_type: colocation
  affects: [ups, power, facility]
  impacts: [outage]
  operators: [Digital Realty, Alibaba Cloud]
  vendors: []
  summary: >
    A fire that the fire service linked to lithium-ion batteries in a battery room took
    down Alibaba Cloud's Singapore Zone C; firefighting water then forced an emergency
    power-down. Restoration was still under way a week later, and ByteDance services
    were also reported disrupted.
  sources:
    - {publisher: The Register, url: "https://www.theregister.com/2024/09/10/digtal_realty_singapore_datacenter_fire/"}
    - {publisher: DatacenterDynamics, url: "https://www.datacenterdynamics.com/en/news/data-center-fire-in-singapore-impacts-alibaba-cloud-causes-bytedance-outage/"}

- id: 2024-baltic-cable-cuts
  date: 2024-11-17
  title: Two Baltic Sea data cables damaged within a day
  type: incident
  category: [physical]
  status: confirmed
  severity: medium
  location: {city: Baltic Sea, country: SE, lat: 55.9, lon: 18.0}
  facility_type: subsea cable
  affects: [connectivity]
  impacts: [outage, service-degradation]
  operators: [Arelion, Cinia]
  vendors: []
  summary: >
    The BCS East-West Interlink (Lithuania–Sweden) failed on November 17 and C-Lion1
    (Finland–Germany) on November 18, both in Swedish waters, while the Chinese bulk
    carrier Yi Peng 3 was dragging its anchor. Sweden's accident board could not
    establish intent; C-Lion1 was repaired by November 28.
  sources:
    - {publisher: German Federal Foreign Office, url: "https://www.auswaertiges-amt.de/en/newsroom/news/2685132-2685132"}
    - {publisher: Reuters via Baird Maritime, url: "https://www.bairdmaritime.com/amp/story/security/incidents/swedish-probe-inconclusive-on-evidence-of-deliberate-cable-damage-by-chinese-ship"}

- id: 2025-ami-megarac-bmc
  date: 2025-03-11
  title: Critical auth bypass in AMI MegaRAC BMC firmware
  type: vulnerability
  category: [it-ot, supply-chain]
  status: confirmed
  severity: critical
  location: null
  affects: [firmware, compute]
  impacts: [exposure]
  operators: []
  vendors: [AMI]
  summary: >
    An authentication bypass in the Redfish interface of AMI's MegaRAC SPx BMC firmware
    (CVE-2024-54085; CVSS 10.0 per AMI, 9.8 per NVD), found by Eclypsium, allows remote
    takeover of servers from many makers. CISA added it to the KEV catalog on
    2025-06-25 after exploitation was reported.
  sources:
    - {publisher: AMI (AMI-SA-2025003), url: "https://go.ami.com/hubfs/Security%20Advisories/2025/AMI-SA-2025003.pdf"}
    - {publisher: NVD, url: "https://nvd.nist.gov/vuln/detail/CVE-2024-54085"}
    - {publisher: CISA, url: "https://www.cisa.gov/news-events/alerts/2025/06/25/cisa-adds-three-known-exploited-vulnerabilities-catalog"}
    - {publisher: Eclypsium, url: "https://eclypsium.com/blog/bmc-vulnerability-cve-2024-05485-cisa-known-exploited-vulnerabilities/"}
