    - {publisher: WAM (Emirates News Agency), url: "https://www.wam.ae/en/article/c1c097j-aip-mgx-blackrocks-gip-close-40-billion"}

- id: 2025-ireland-cru-dc-connection-policy
  date: 2025-12-12
  title: Ireland requires new data centers to bring their own generation to connect
  type: policy
  category: [regulation, energy]
  status: confirmed
  severity: high
  location: null
  affects: [power]
  impacts: [cost]
  operators: []
  vendors: []
  summary: >
    The Commission for Regulation of Utilities issued its final large energy user connection
    policy (CRU2025236): new data center grid connections must be matched by new dispatchable
    generation or storage that participates in the market, plus additional Irish renewables.
    CRU puts data centers at about 22% of national electricity use.
