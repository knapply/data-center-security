- id: 2022-london-heatwave-cooling
  date: 2022-07-19
  title: Record heat knocks out cooling at London cloud data centers
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: London, country: GB, lat: 51.51, lon: -0.13}
  facility_type: cloud region
  affects: [cooling]
  impacts: [outage, service-degradation]
  operators: [Google Cloud, Oracle Cloud]
  vendors: []
  summary: >
    On the UK's hottest recorded day, cooling failures in London forced Google Cloud
    (europe-west2-a) and Oracle Cloud (UK South) to power down equipment, terminating
    VMs and disrupting services. Google later attributed its outage to the simultaneous
    failure of multiple redundant cooling systems.
  sources:
    - {publisher: Google Cloud status page, url: "https://status.cloud.google.com/incidents/XVq5om2XEDSqLtJZUvcH"}
    - {publisher: The Register, url: "https://www.theregister.com/2022/07/19/google_oracle_cloud/"}

