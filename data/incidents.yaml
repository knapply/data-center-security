- id: 2026-new-york-dc-moratorium
  date: 2026-07-14
  title: New York pauses state permits for data centers of 50 MW or more
  type: policy
  category: [regulation, capacity]
  status: ongoing
  severity: high
  location: null
  affects: []
  impacts: [capacity-delayed]
  operators: []
  vendors: []
  summary: >
    Governor Hochul's Executive Order 62 pauses discretionary DEC permits for new or
    expanded data centers of 50 MW or more until the state completes a generic environmental
    impact statement, the first statewide moratorium in the US. Research, education,
    manufacturing and medical facilities are exempt; the order cites about 12 GW of data
    center requests in the NYISO queue.
