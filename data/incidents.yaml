- id: 2020-nashville-co-bombing
  date: 2020-12-25
  title: Vehicle bomb damages AT&T central office in Nashville
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Nashville, country: US, lat: 36.16, lon: -86.78}
  facility_type: telecom central office
  affects: [power, cooling, connectivity, facility]
  impacts: [outage, service-degradation, safety]
  operators: [AT&T]
  vendors: []
  summary: >
    A Christmas-morning vehicle bomb outside a downtown AT&T central office cut
    commercial power, and water and fire damage then disabled the backup generators.
    Wireless, wireline and 911 service failed across parts of Tennessee, Kentucky and
    Alabama; AT&T restored most service in about three days.
  sources:
    - {publisher: Data Center Frontier, url: "https://datacenterfrontier.com/nashville-bombing-att-repairs-damage-to-its-building-and-network/"}
    - {publisher: AP via WTTW, url: "https://news.wttw.com/2020/12/26/downtown-nashville-explosion-knocks-communications-offline"}
    - {publisher: Tennessee Lookout, url: "https://tennesseelookout.com/2021/05/19/tennessee-board-details-impact-of-christmas-bombing-on-911-systems/"}
    - {publisher: FBI Memphis, url: "https://www.fbi.gov/contact-us/field-offices/memphis/news/press-releases/fbi-releases-report-on-nashville-bombing"}

- id: 2021-ovh-sbg-fire
  date: 2021-03-10
  title: Fire destroys OVHcloud SBG2 data center in Strasbourg
  type: incident
  category: [physical]
  status: confirmed
  severity: critical
  location: {city: Strasbourg, country: FR, lat: 48.58, lon: 7.75}
  facility_type: data center campus
  affects: [ups, power, facility]
  impacts: [outage, data-loss, financial]
  operators: [OVHcloud]
  vendors: []
  summary: >
    A fire that started in a power room housing UPS units destroyed the SBG2 building
    and part of SBG1, and the whole campus lost power. Customers without off-site
    backups lost data permanently; French courts later ordered OVHcloud to compensate
    clients whose paid backups were stored in the same building.
  sources:
    - {publisher: The Register, url: "https://www.theregister.com/2021/03/10/ovh_strasbourg_fire/"}
    - {publisher: Le Monde Informatique (BEA-RI report), url: "https://www.lemondeinformatique.fr/actualites/lireamp-incendie-ovh-le-bea-ri-liste-plusieurs-faiblesses-87043.html"}
    - {publisher: Le Monde Informatique (court ruling), url: "https://www.lemondeinformatique.fr/actualites/lire-incendie-sgb2-strasbourg-ovh-condamne-a-verser-plus-de-100-000-eteuro-89434.html"}

