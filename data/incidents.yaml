- id: 2025-ami-megarac-bmc
  date: 2025-03-11
  title: Critical auth bypass in AMI MegaRAC BMC firmware
  type: vulnerability
  category: [it-ot, supply-chain]
  status: confirmed
  severity: critical
  location: null
  affects: [firmware, compute]
  impacts: [exposure]
  operators: []
  vendors: [AMI]
  summary: >
    An authentication bypass in the Redfish interface of AMI's MegaRAC SPx BMC firmware
    (CVE-2024-54085; CVSS 10.0 per AMI, 9.8 per NVD), found by Eclypsium, allows remote
    takeover of servers from many makers. CISA added it to the KEV catalog on
    2025-06-25 after exploitation was reported.
  sources:
    - {publisher: AMI (AMI-SA-2025003), url: "https://go.ami.com/hubfs/Security%20Advisories/2025/AMI-SA-2025003.pdf"}
    - {publisher: NVD, url: "https://nvd.nist.gov/vuln/detail/CVE-2024-54085"}
    - {publisher: CISA, url: "https://www.cisa.gov/news-events/alerts/2025/06/25/cisa-adds-three-known-exploited-vulnerabilities-catalog"}
    - {publisher: Eclypsium, url: "https://eclypsium.com/blog/bmc-vulnerability-cve-2024-05485-cisa-known-exploited-vulnerabilities/"}
    - {publisher: HPE security bulletin, url: "https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbcr04828en_us&docLocale=en_US"}
    - {publisher: The Hacker News, url: "https://thehackernews.com/2025/03/new-critical-ami-bmc-vulnerability.html"}
    - {publisher: BleepingComputer, url: "https://www.bleepingcomputer.com/news/security/asus-releases-fix-for-ami-bug-that-lets-hackers-brick-servers/"}
  root_cause:
    summary: >
      Authentication bypass by spoofing (CWE-290) in the Redfish Host Interface of AMI's
      MegaRAC SPx BMC firmware, reachable remotely or from the host.
    confidence: confirmed
    components:
      - part: BMC firmware (Redfish Host Interface)
        role: origin
        manufacturer: AMI
        model: MegaRAC SPx
        versions: >
          12.0 to before 12.7 and 13.0 to before 13.5 per AMI's CVE record; NVD's
          configuration lists only 13.0 to before 13.5.
        serial: null
        detail: Fixed in SPx 12.7+ and 13.5 (AMI-SA-2025003, 2025-03-11).
      - part: Server BMC
        role: affected
        manufacturer: HPE
        model: Cray XD670
        versions: BMC before 1.19
        serial: null
        detail: Confirmed by Eclypsium; HPE bulletin hpesbcr04828.
      - part: Server BMC
        role: affected
        manufacturer: ASUS
        model: RS720A-E11-RS24U; PRO WS W790E-SAGE SE and other workstation boards
        versions: null
        serial: null
        detail: >
          Eclypsium confirmed the RS720A-E11-RS24U; ASUS's April 2025 fixes (via
          BleepingComputer) covered four workstation boards.
      - part: Server BMC
        role: affected
        manufacturer: ASRock Rack
        model: null
        versions: null
        serial: null
        detail: Named by Eclypsium from static analysis; no model given.
  supply_chain_factors:
    - factor: >
        One AMI firmware stack is reused across many server OEMs, so a single flaw spans
        brands and each OEM ships its own fix on its own schedule.
      component: firmware
      confidence: confirmed
