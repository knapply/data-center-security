  affects: [ups, power, facility]
  impacts: [outage, service-degradation]
  operators: [SK C&C, Kakao]
  vendors: []
  summary: >
    A fire that a government review traced to lithium-ion batteries in a basement
    battery room knocked out UPS and backup power together, forcing a power cut to the
    facility. Kakao's messaging, payment and mobility services were disrupted for days,
    127.5 hours in total by the ministry's count.
  sources:
    - {publisher: Korea JoongAng Daily, url: "https://www.koreajoongangdaily.com/business/ict-ministry-completes-its-probe-of-kakao-service-outage/11629261"}
    - {publisher: Bloomberg via Data Center Knowledge, url: "https://www.datacenterknowledge.com/business/data-center-fire-triggers-lithium-ion-battery-doubts-south-korea"}
    - {publisher: The Register, url: "https://www.theregister.com/2022/10/17/sk_cc_naver_kaako_fire/"}
    - {publisher: iNews24 (MSIT findings), url: "https://www.inews24.com/view/1580504"}
    - {publisher: Metro Seoul, url: "https://www.metroseoul.co.kr/article/20230308500034"}
    - {publisher: Newsworker, url: "https://www.newsworker.co.kr/news/articleView.html?idxno=183955"}
    - {publisher: EPRI Storage Wiki, url: "https://storagewiki.epri.com/index.php/Failure_Event_-_South_Korea,_Pangyo_-_15_Oct_2022"}
  root_cause:
    summary: >
      A lithium-ion battery rack in a basement battery room caught fire; partial National
      Forensic Service results cited by MSIT point to an internal short from age-related
      insulation breakdown in a cell.
    confidence: likely
    components:
      - part: Lithium-ion UPS battery cell/rack
        role: origin
        manufacturer: SK On
        model: null
        versions: null
        serial: null
        detail: >
          Maker named by Kakao's CEO and Korean press, not by an investigator; SK C&C said
          it could not confirm the battery maker. Battery model and UPS maker not published. The batteries
          replaced lead-acid units in 2016 (Metro Seoul). The cell-ageing finding was
          partial; no final police or forensic report was found.
      - part: Battery monitoring system
        role: contributing
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          MSIT said the BMS detected nothing abnormal before the fire. SK published logs
          showing normal readings; some local reports claimed warnings, so accounts differ.
      - part: UPS and backup power
        role: affected
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          Sat in the same room as the batteries, so both were lost together. MSIT also found
          no fire suppression suited to lithium-ion fires.
  supply_chain_factors:
    - factor: >
        Battery maker and data center operator are affiliates in the same group (SK), and the
        cells were about six years old when the cell-ageing finding was made.
      component: batteries
      confidence: likely

- id: 2023-gcp-paris-water-fire
  date: 2023-04-26
  title: Water leak and fire take Google Cloud europe-west9 zone offline
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Paris, country: FR, lat: 48.86, lon: 2.35}
  facility_type: cloud region
  affects: [ups, facility]
  impacts: [outage, service-degradation]
  operators: [Google Cloud, Global Switch]
  vendors: []
  summary: >
    Water from a cooling-system pipe leaked into a UPS battery room in a Global Switch
    colocation building and caused a fire. The resulting shutdown hit multiple zones of
    Google Cloud's Paris region, and part of europe-west9-a needed a multi-day staged
    recovery.
  sources:
    - {publisher: Google Cloud status page, url: "https://status.cloud.google.com/incidents/dS9ps52MUnxQfyDGPfkY"}
    - {publisher: The Register, url: "https://www.theregister.com/2023/04/26/google_cloud_outage/"}
    - {publisher: Préfet des Hauts-de-Seine / DRIEAT inspection report (Géorisques), url: "https://georisques.gouv.fr/webappReport/ws/installations/inspection/uTYqOHTp7MEpeWajJaAcsGmb7jJr9G97"}
    - {publisher: Le Monde Informatique, url: "https://www.lemondeinformatique.fr/actualites/lire-une-fuite-a-l-origine-de-l-incendie-du-datacenter-global-switch-clichy-90294.html"}
  root_cause:
    summary: >
      Water leaking from a cooling-system pipe on the floor above reached the level-1 UPS
      and battery rooms, and lithium batteries went into thermal runaway.
    confidence: confirmed
    components:
      - part: Cooling-system water pipe
        role: origin
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          Google's report places the leak in a non-Google part of the building; the French
          inspection report (DRIEAT, 2025) traces it to a cooling-tower secondary circuit pipe
          on level 2. A secondhand account on a French operators' list
          (reported by DCD) blamed a cooling water pump; Google does not mention a pump.
      - part: Lithium UPS batteries
        role: affected
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          Per the DRIEAT inspection report, the operator's accident notice says lithium iron
          (phosphate) batteries while its permit filing says lithium-ion. Water also reached
          static UPS units, which lacked cable glands recommended by their (unnamed)
          manufacturer. No maker is published; Global Switch's filings that might name one
          are not public.
      - part: Building fire-suppression water supply
        role: contributing
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: Google reports the building's suppression water ran out during the fire.
  supply_chain_factors:
    - factor: >
        The leaking cooling infrastructure belonged to the shared colocation building
        (Global Switch), outside Google's own space and control.
      component: cooling
      confidence: confirmed

- id: 2023-azure-sydney-chillers
  date: 2023-08-30
  title: Utility power sag trips chillers in Azure Australia East
  type: incident
  category: [physical]
  status: confirmed
  severity: high
  location: {city: Sydney, country: AU, lat: -33.87, lon: 151.21}
  facility_type: cloud region
  affects: [power, cooling]
  impacts: [outage, service-degradation]
  operators: [Microsoft Azure]
  vendors: []
  summary: >
    A lightning-induced utility voltage sag tripped chillers at a Sydney datacenter;
    night staffing was too thin to restart them in time, and Microsoft shut down
    infrastructure in two data halls to protect hardware. Some Azure services stayed
    degraded until September 3.
  sources:
    - {publisher: Microsoft Azure post-incident review (VVTQ-J98), url: "https://azure.status.microsoft/en-us/status/history/?trackingId=VVTQ-J98"}
    - {publisher: The Register, url: "https://www.theregister.com/2023/09/04/microsoft_australia_outage_incident_report/"}
  root_cause:
    summary: >
      A lightning-induced voltage sag tripped chillers, and an operating configuration
      susceptible to a timing defect in the Chiller Management System kept 13 of them
      from restarting automatically.
    confidence: confirmed
    components:
      - part: Chiller Management System
        role: origin
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: Timing defect named in the final PIR; vendor not published.
      - part: Chillers
        role: affected
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          The two affected halls had 7 chillers (5 running, 2 standby) and needed at least 4.
          Five would not restart manually because the chilled-water loop was already too hot.
      - part: Onsite operations staffing
        role: contributing
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          The preliminary PIR (via The Register) said 3 night staff were too few; Microsoft
          raised it to 7 and switched to a load-based restart order.
  supply_chain_factors:
    - factor: A defect in the chiller control software prevented automatic restart after a power event.
      component: cooling
      confidence: confirmed

