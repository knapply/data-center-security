- id: 2026-eu-dc-sustainability-rating
  date: 2026-09-21
  title: EU Commission adopts mandatory sustainability rating and label for data centers
  type: policy
  category: [regulation, energy]
  status: ongoing
  severity: high
  location: null
  affects: []
  impacts: [cost]
  operators: []
  vendors: []
  summary: >
    The Commission adopted a delegated regulation (C(2026) 3472) amending 2024/1364 that turns
    data center reporting into a mandatory A-to-G sustainability rating and electronic label
    for sites of 500 kW or more, based on PUE, WUE, energy sourcing and waste-heat reuse, with
    labels from August 2027. It came alongside a proposed Cloud and AI Development Act
    and is now under Parliament and Council scrutiny.
  sources:
    - {publisher: Linklaters, url: "https://sustainablefutures.linklaters.com/post/102o5fr/eu-commission-adopts-data-centre-sustainability-rating-scheme"}
    - {publisher: Freshfields, url: "https://www.freshfields.com/en/our-thinking/blogs/sustainability/from-reporting-to-rating-the-eus-next-steps-for-data-centres-102o345"}
    - {publisher: Beveridge & Diamond, url: "https://www.bdlaw.com/publications/european-commission-advances-data-center-sustainability-ratings-and-consults-on-minimum-performance-standards/"}
