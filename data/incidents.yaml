    value of about $40B, the largest data center deal on record. It closed in July 2026
    with $5B of added growth capital; Aligned then had 51 campuses and over 6.4 GW planned
    or operating.
  sources:
    - {publisher: DatacenterDynamics, url: "https://datacenterdynamics.com/en/news/aligned-data-centers-sold-to-blackrock-and-mgx-in-record-breaking-40bn-deal"}
