- id: 2021-ovh-sbg-fire
  date: 2021-03-10
  title: Fire destroys OVHcloud SBG2 data center in Strasbourg
  type: incident
  category: [physical]
  status: confirmed
  severity: critical
  location: {city: Strasbourg, country: FR, lat: 48.58, lon: 7.75}
  facility_type: data center campus
  affects: [ups, power, facility]
  impacts: [outage, data-loss, financial]
  operators: [OVHcloud]
  vendors: []
  summary: >
    A fire that started in a power room housing UPS units destroyed the SBG2 building
    and part of SBG1, and the whole campus lost power. Customers without off-site
    backups lost data permanently; French courts later ordered OVHcloud to compensate
    clients whose paid backups were stored in the same building.
  sources:
    - {publisher: The Register, url: "https://www.theregister.com/2021/03/10/ovh_strasbourg_fire/"}
    - {publisher: Le Monde Informatique (BEA-RI report), url: "https://www.lemondeinformatique.fr/actualites/lireamp-incendie-ovh-le-bea-ri-liste-plusieurs-faiblesses-87043.html"}
    - {publisher: Le Monde Informatique (court ruling), url: "https://www.lemondeinformatique.fr/actualites/lire-incendie-sgb2-strasbourg-ovh-condamne-a-verser-plus-de-100-000-eteuro-89434.html"}
    - {publisher: Journal du Net (BEA-RI report), url: "https://www.journaldunet.com/web-tech/cloud/1509749-enquete-sur-l-incendie-d-ovh-des-conclusions-accablantes/"}
    - {publisher: Solutions Numériques (Klaba statement), url: "https://www.solutions-numeriques.com/securite/exclusif-les-causes-de-lincendie-ovh-strasbourg-des-explications-stupefiantes/"}
  root_cause:
    summary: >
      Fire started in SBG2's ground-floor UPS and battery power room, almost simultaneously
      on batteries and an inverter; the exact mechanism was not determined.
    confidence: likely
    components:
      - part: UPS inverter (UPS 7)
        role: origin
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          BEA-RI cites CCTV showing fire starting at the UPS/batteries, and sensors logging
          unusual humidity behind the inverters before the fire. Its hypotheses are water or
          humidity from nearby cooling, or the maintenance done that morning; it left the
          cause to a judicial inquiry. Octave Klaba said a supplier replaced many parts inside
          UPS 7 that morning. Maker not published.
      - part: Lead-acid UPS batteries
        role: contributing
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: Burned with the inverters (BEA-RI via Le Monde Informatique).
      - part: Free-cooling building design
        role: contributing
        manufacturer: null
        model: null
        versions: null
        serial: null
        detail: >
          BEA-RI found the inner courtyards of the outside-air cooling design acted as
          chimneys. There was no automatic extinguishing and no general power cutoff; power
          stayed live for about three hours.
  supply_chain_factors:
    - factor: >
        UPS 7 had been serviced by its (unnamed) supplier the same morning; the maintenance
        is one of BEA-RI's hypotheses, and the supplier link comes from OVHcloud's founder.
      component: batteries
      confidence: suspected

- id: 2022-tlstorm-apc-ups
  date: 2022-03-08
  title: TLStorm flaws allow remote takeover of APC Smart-UPS devices
  type: vulnerability
  category: [it-ot]
  status: confirmed
  severity: high
  location: null
  affects: [ups, firmware]
  impacts: [exposure]
  operators: []
  vendors: [Schneider Electric]
  summary: >
    Three vulnerabilities disclosed by Armis in APC Smart-UPS devices (NVD CVSS up to
    9.8) could let an attacker take over a UPS and physically damage it or cut power to
    connected equipment. Schneider Electric issued fixes; no exploitation was reported.
  sources:
    - {publisher: Schneider Electric (SEVD-2022-067-02), url: "https://www.se.com/ww/en/download/document/SEVD-2022-067-02/"}
    - {publisher: NVD, url: "https://nvd.nist.gov/vuln/detail/CVE-2022-22805"}
    - {publisher: NVD, url: "https://nvd.nist.gov/vuln/detail/CVE-2022-22806"}
    - {publisher: NVD, url: "https://nvd.nist.gov/vuln/detail/CVE-2022-0715"}
    - {publisher: Duo Decipher, url: "https://duo.com/decipher/trio-of-flaws-allows-remote-takeover-of-some-apc-ups-devices"}
  root_cause:
    summary: >
      APC's network-management firmware mishandled errors from the embedded NanoSSL TLS
      library, and firmware updates were not securely signed.
    confidence: confirmed
    components:
      - part: Smart-UPS SmartConnect / network management firmware
        role: origin
        manufacturer: Schneider Electric (APC)
        model: Smart-UPS SMT, SMC, SMTL, SCL, SMX, SRT series
        versions: >
          CVE-2022-22806 per NVD: SMT up to UPS 04.5, SMC up to 04.2, SMTL up to 02.9,
          SCL up to 02.5 (IDs 1029/1030/1036) or 03.1 (ID 1037), SMX up to 03.1.
          CVE-2022-0715 also covers SRT and non-SmartConnect lines; see SEVD-2022-067-02.
        serial: null
        detail: >
          CVE-2022-22805 is a TLS reassembly buffer overflow and CVE-2022-22806 a TLS
          authentication bypass, both pre-auth RCE; CVE-2022-0715 is unsigned firmware
          upgrades.
      - part: NanoSSL TLS library
        role: contributing
        manufacturer: Mocana
        model: NanoSSL
        versions: null
        serial: null
        detail: >
          Armis says the library requires callers to close the connection on TLS errors and
          APC's code ignored some errors. The library itself was not reported as flawed.
  supply_chain_factors:
    - factor: A third-party embedded TLS library was integrated incorrectly into UPS firmware.
      component: firmware
      confidence: confirmed
    - factor: UPS firmware updates were not cryptographically signed, so malicious firmware could be installed.
      component: firmware
      confidence: confirmed

