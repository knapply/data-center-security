# Controlled vocabulary. The validator rejects values not listed here.
# Add a term only when no existing one fits, and say why in the PR.

type:
  - incident       # something went wrong: fire, outage, attack, cable cut
  - vulnerability  # a flaw in data center infrastructure
  - policy         # a law, regulation, permit rule or moratorium
  - development    # industry news: new builds, power deals, financing, M&A, earnings
category:
  # Security
  - physical
  - it-ot
  - supply-chain
  # Industry
  - energy       # power procurement, grid capacity, generation built for data centers
  - capacity     # new campuses, expansions, cancellations, construction
  - market       # deals, M&A, financing, earnings, pricing
  - regulation   # permitting, moratoria, water, efficiency and reporting rules
status: [confirmed, ongoing, unconfirmed]
severity: [low, medium, high, critical]
affects:
  - power        # utility feed, switchgear, generators
  - ups          # UPS systems and battery rooms
  - cooling      # chillers, CRAH/CRAC, liquid cooling
  - connectivity # fiber, subsea cables, carrier links
  - compute      # servers, accelerators
  - storage
  - firmware     # BMC, BIOS, device firmware
  - bms          # building management / SCADA / ICS
  - access-control
  - facility     # the building itself
confidence:      # how sure the sources are about a cause or a supply chain factor
  - confirmed    # stated in an official report, advisory, or by the operator/vendor
  - likely       # reported by investigators or multiple credible outlets
  - suspected    # a single credible report or expert analysis
  - unknown      # nothing published yet
component_role:
  - origin       # where the failure started
  - contributing # made it worse or failed to stop it
  - affected     # damaged or vulnerable, but not the cause
impacts:
  - outage
  - service-degradation
  - data-loss
  - exposure     # exploitable weakness, no confirmed harm yet
  - delay        # supply or construction delay
  - financial
  - safety
  - capacity-added    # new data center capacity announced or delivered
  - capacity-delayed  # a project slowed, paused or cancelled
  - investment        # capital committed
  - cost              # higher prices or costs for operators or customers
